name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexttodo/web check
      - run: pnpm --filter @nexttodo/web build
      - uses: actions/upload-artifact@v4
        with:
          name: nexttodo-web
          path: apps/web/dist
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p nexttodo-server -p nexttodo-cli
      - uses: actions/upload-artifact@v4
        with:
          name: nexttodo-server
          path: |
            target/release/nexttodo-server
            target/release/nexttodo
          retention-days: 7

  desktop-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      # The updater's signature is not available here: the app is ad-hoc signed, like the local
      # builds, so that it can still be made and installed by hand. The server image does not carry
      # /app/desktop.json anyway, so it would not self-update.
      - name: Build Apple silicon
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app,dmg --config '{"version":"0.1.'"$(git rev-list --count HEAD)"'","bundle":{"createUpdaterArtifacts":false}}'
      - name: Build Intel
        working-directory: apps/desktop
        run: pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg --config '{"version":"0.1.'"$(git rev-list --count HEAD)"'","bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: NextTodo-macos-arm64
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: NextTodo-macos-x64
          path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

  image:
    needs: [web, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexttodo-web
          path: apps/web/dist
      - uses: actions/download-artifact@v4
        with:
          name: nexttodo-server
          path: target/release
      - name: Build the image
        run: |
          mkdir -p target/ci/web
          cp -a apps/web/dist/. target/ci/web/
          cp target/release/nexttodo-server target/ci/nexttodo-server
          cp target/release/nexttodo target/ci/nexttodo
          cat > target/ci/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          COPY nexttodo-server /nexttodo-server
          COPY nexttodo /usr/local/bin/nexttodo
          COPY web /web
          RUN chmod a+rx /nexttodo-server /usr/local/bin/nexttodo
          RUN chmod -R a+rX /web
          ENV NEXTTODO_DATA=/data NEXTTODO_WEB=/web NEXTTODO_LISTEN=0.0.0.0:8080
          USER 65534:65534
          EXPOSE 8080
          ENTRYPOINT ["/nexttodo-server"]
          CMD ["serve"]
          EOF
          docker build -t nexttodo:ci target/ci
          docker save nexttodo:ci | gzip > nexttodo-image.tar.gz
      - name: Publish to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"
          docker tag nexttodo:ci "$image:main"
          docker tag nexttodo:ci "$image:${GITHUB_SHA::12}"
          docker push "$image:main"
          docker push "$image:${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@v4
        with:
          name: nexttodo-image
          path: nexttodo-image.tar.gz
          retention-days: 7
